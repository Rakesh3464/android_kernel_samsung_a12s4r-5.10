name: Linux 5.10 toolchain build probe (NOT AN A21S PORT)
on:
  pull_request:
    branches: [android13-5.10-lts]
  workflow_dispatch:
    inputs:
      config_target:
        description: 'Kernel configuration target for a toolchain smoke test'
        required: false
        default: 'exynos850-a12snsxx_defconfig'
        type: choice
        options: [exynos850-a12snsxx_defconfig, tinyconfig, defconfig]
  push:
    branches: [a21s-5-10-port-preflight]
    paths:
      - '.github/workflows/a21s-5-10-build-probe.yml'
jobs:
  compile-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 lz4
      - name: Probe ARM64 toolchain compilation and image size
        shell: bash
        env:
          REQUESTED_CONFIG: ${{ inputs.config_target || 'exynos850-a12snsxx_defconfig' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo 'Source version:'
            head -n 6 Makefile
            echo 'Compiler:'
            clang --version | head -n 1
            echo "Requested config target: $REQUESTED_CONFIG"
            echo 'A12s vendor configuration is NOT an A21s config or hardware port.'
            echo 'Available config examples:'
            find arch/arm64/configs -type f -name '*defconfig' | head -n 40 || true
          } | tee artifacts/preflight.txt
          case "$REQUESTED_CONFIG" in exynos850-a12snsxx_defconfig|tinyconfig|defconfig) ;; *) exit 2;; esac
          if ! make O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- "$REQUESTED_CONFIG" > artifacts/config.log 2>&1; then
            echo "FAIL: Kernel config target '$REQUESTED_CONFIG'." | tee artifacts/status.txt
            exit 1
          fi
          cp out/.config artifacts/kernel-config.txt
          if ! make -j2 O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- Image.gz > artifacts/compile.log 2>&1; then
            echo "FAIL: Generic Image.gz compilation; see compile.log" | tee artifacts/status.txt
            exit 1
          fi
          image=out/arch/arm64/boot/Image.gz
          test -s "$image"
          size=$(stat -c%s "$image")
          {
            echo "A12s-source $REQUESTED_CONFIG Image.gz = $size bytes"
            echo 'Reported A21s boot partition = 36 MiB (37,748,736 bytes), unverified on device'
            echo 'Image.gz is NOT a boot.img; ramdisk, DTB, boot headers and partitions also matter.'
            echo 'NOT FLASHABLE. No A21s-specific device tree, drivers or vendor ABI validation.'
          } | tee artifacts/status.txt
          # Save the kernel binary separately as a source-build reference ONLY.
          # This is NOT an Android boot image or safe for flashing.
          mkdir -p artifacts/nonflashable-kernel
          cp "$image" artifacts/nonflashable-kernel/A12S_5.10_Image.gz_NOT_FLASHABLE
          sha256sum artifacts/nonflashable-kernel/A12S_5.10_Image.gz_NOT_FLASHABLE > artifacts/nonflashable-kernel/SHA256SUMS.txt
          budget=$((36*1024*1024))
          echo "Raw boot-partition space remaining before ramdisk/DTB/header: $((budget-size)) bytes" >> artifacts/status.txt
      - name: Upload logs and size measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-5-10-toolchain-probe-logs
          path: artifacts/
          if-no-files-found: warn
