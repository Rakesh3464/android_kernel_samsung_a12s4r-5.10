name: A21s Linux 5.10 SUSFS object compile probe (NOT FLASHABLE)

on:
  push:
    branches:
      - a21s-susfs-port
    paths:
      - '.github/workflows/a21s-susfs-compile-probe.yml'
      - 'a21s_porting/susfs_compile_probe.sh'
      - 'a21s_porting/adapt_susfs_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  susfs-ephemeral-object-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - name: Checkout kernel source (disposable Actions working directory)
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Install kernel compilation requirements
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            make build-essential bc bison flex libssl-dev libelf-dev python3 \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch pinned SUSFS gki-android13-5.10 upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          git clone --depth 1 --branch gki-android13-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs \
            > report/upstream-clone.log 2>&1
          sha="$(git -C susfs rev-parse HEAD)"
          echo "$sha" > report/susfs-upstream-sha.txt
          expected=d480b312d650601888550529695706f4a112e29e
          if [ "$sha" != "$expected" ]; then
            echo "BLOCKED: upstream changed from tested source; review before updating" | tee report/BLOCKED.txt
            exit 1
          fi

      - name: Patch temporary checkout and attempt compiling fs/susfs.o
        shell: bash
        run: |
          set -euo pipefail
          bash kernel/a21s_porting/susfs_compile_probe.sh kernel susfs report

      - name: Upload SUSFS build diagnostics only (NO boot files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SM-A217F-SUSFS-5.10-COMPILE-PROBE-NOT-FLASHABLE
          path: |
            report/*.txt
            report/*.log
            report/*.config
          retention-days: 30
          if-no-files-found: warn
