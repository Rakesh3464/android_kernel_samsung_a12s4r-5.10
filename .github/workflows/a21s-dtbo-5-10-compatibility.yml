name: A21s DTBO on 5.10 base compatibility probe (NOT FLASHABLE)
on:
  workflow_dispatch:
  pull_request:
    branches: [android13-5.10-lts]
  push:
    branches: [a21s-5-10-port-preflight]
    paths:
      - '.github/workflows/a21s-dtbo-5-10-compatibility.yml'
      - 'scripts/check-dtbo-symbols.py'
      - 'scripts/validate-overlay-own-references.py'
      - 'scripts/check-dtbo-fixup-locations.py'
jobs:
  overlay-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out 5.10 base source
        uses: actions/checkout@v4
        with:
          path: kernel-5.10
          submodules: false
      - name: Check out A21s original device tree
        uses: actions/checkout@v4
        with:
          repository: Rakesh3464/atlas-new
          ref: master
          path: a21s-4.19
          submodules: false
          sparse-checkout: |
            arch/arm64/boot/dts
      - name: Install dtc and fdtoverlay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y device-tree-compiler
      - name: Validate each original A21s DTBO on the 5.10 base DTB
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results
          base=kernel-5.10/arch/arm64/boot/dts/exynos/s5e3830.dts
          if ! dtc -@ -I dts -O dtb -o results/s5e3830_5.10.dtb "$base" > results/base.log 2>&1; then
            echo 'BLOCKED: 5.10 base DTS did not compile. See base.log' | tee results/SUMMARY.txt
            exit 1
          fi
          echo '5.10 base DTS syntax compiled successfully.' | tee results/SUMMARY.txt
          echo '== Experimental chosen-symbol repair (comparison copy only) ==' | tee -a results/SUMMARY.txt
          cp results/s5e3830_5.10.dtb results/s5e3830_chosen_probe.dtb
          if ! fdtget -t s results/s5e3830_chosen_probe.dtb /__symbols__ chosen >/dev/null 2>&1; then
            if ! fdtget -l results/s5e3830_chosen_probe.dtb / | grep -Fxq chosen; then
              fdtput -c results/s5e3830_chosen_probe.dtb /chosen
            fi
            fdtput -t s results/s5e3830_chosen_probe.dtb /__symbols__ chosen /chosen
            echo 'Added chosen => /chosen symbol in temporary DTB, NOT kernel source' | tee -a results/SUMMARY.txt
          fi
          echo '== A12s own DTBO positive control on the same 5.10 base ==' | tee -a results/SUMMARY.txt
          a12s=kernel-5.10/arch/arm64/boot/dts/samsung/a12s/a12s_eur_open_w00_r00.dts
          if dtc -@ -I dts -O dtb -o results/a12s-control.dtbo "$a12s" >results/a12s-control-dtc.log 2>&1; then
            if fdtoverlay -i results/s5e3830_5.10.dtb -o results/a12s-control-combined.dtb results/a12s-control.dtbo >results/a12s-control-overlay.log 2>&1; then
              echo 'POSITIVE CONTROL PASS: A12s own overlay applied' | tee -a results/SUMMARY.txt
            else
              echo 'POSITIVE CONTROL FAIL: even the matching A12s overlay did not apply; base/overlay test methodology may be invalid.' | tee -a results/SUMMARY.txt
              sed -n '1,18p' results/a12s-control-overlay.log | tee -a results/SUMMARY.txt
            fi
          else
            echo 'POSITIVE CONTROL DTS compilation FAIL; see a12s-control-dtc.log' | tee -a results/SUMMARY.txt
          fi
          echo '== Inspect root targets and placeholder phandles ==' | tee -a results/SUMMARY.txt
          for src in a21s-4.19/arch/arm64/boot/dts/samsung/a21s/a21s_eur_open_w00_r00.dts "$a12s"; do
            echo "SOURCE: $src" | tee -a results/SUMMARY.txt
            grep -m 8 -E 'target-path|target =|0xffffffff' "$src" | cut -c1-200 | tee -a results/SUMMARY.txt || true
          done
          success=0
          failed=0
          patched_success=0
          patched_failed=0
          for rev in r00 r01 r02 r03 r06; do
            src="a21s-4.19/arch/arm64/boot/dts/samsung/a21s/a21s_eur_open_w00_${rev}.dts"
            if ! dtc -@ -I dts -O dtb -o "results/a21s-${rev}.dtbo" "$src" >"results/${rev}-dtc.log" 2>&1; then
              echo "DTBO syntax failed: $rev" | tee -a results/SUMMARY.txt
              failed=$((failed+1))
              continue
            fi
            if fdtoverlay -i results/s5e3830_5.10.dtb -o "results/a21s-${rev}-on-5.10.dtb" "results/a21s-${rev}.dtbo" >"results/${rev}-overlay.log" 2>&1; then
              echo "Overlay application PASS: $rev (structure only)" | tee -a results/SUMMARY.txt
              success=$((success+1))
            else
              echo "Overlay application FAIL: $rev — base/overlay phandle or target mismatch; see log" | tee -a results/SUMMARY.txt
              failed=$((failed+1))
            fi
            # Differential diagnostic: determine whether old A21s local-fixup paths
            # are the reason libfdt reports FDT_ERR_NOTFOUND.
            # Removing local-fixups breaks internal phandle relocation:
            # ANY OUTPUT FROM THIS PROBE IS ALWAYS UNSAFE TO FLASH.
            cp "results/a21s-${rev}.dtbo" "results/a21s-${rev}-no-local-fixups-PROBE.dtbo"
            if fdtget -l "results/a21s-${rev}-no-local-fixups-PROBE.dtbo" / | grep -Fxq '__local_fixups__'; then
              fdtput -r "results/a21s-${rev}-no-local-fixups-PROBE.dtbo" /__local_fixups__
            fi
            if fdtoverlay -i results/s5e3830_chosen_probe.dtb -o "results/a21s-${rev}-without-local-fixups-DIAGNOSTIC.dtb" "results/a21s-${rev}-no-local-fixups-PROBE.dtbo" >"results/${rev}-no-local-fixups.log" 2>&1; then
              echo "DIAGNOSTIC: $rev applies WITHOUT local fixups. Broken __local_fixups__ paths are suspected; output is INVALID and MUST NOT BE FLASHED." | tee -a results/SUMMARY.txt
            else
              echo "DIAGNOSTIC: $rev still fails without local fixups; inspect __fixups__ path targets." | tee -a results/SUMMARY.txt
              sed -n '1,6p' "results/${rev}-no-local-fixups.log" | tee -a results/SUMMARY.txt
            fi
            if test -f "results/a21s-${rev}.dtbo"; then
              if fdtoverlay -i results/s5e3830_chosen_probe.dtb -o "results/a21s-${rev}-on-chosen-probe.dtb" "results/a21s-${rev}.dtbo" >"results/${rev}-chosen-probe.log" 2>&1; then
                echo "CHOSEN PROBE PASS: $rev (structure only, NOT FLASHABLE)" | tee -a results/SUMMARY.txt
                patched_success=$((patched_success+1))
              else
                echo "CHOSEN PROBE FAIL: $rev" | tee -a results/SUMMARY.txt
                patched_failed=$((patched_failed+1))
                sed -n '1,8p' "results/${rev}-chosen-probe.log" | tee -a results/SUMMARY.txt
              fi
            fi
          done
          echo "ORIGINAL BASE PASS=$success FAIL=$failed" | tee -a results/SUMMARY.txt
          echo "CHOSEN-SYMBOL PROBE PASS=$patched_success FAIL=$patched_failed" | tee -a results/SUMMARY.txt
          echo 'No boot.img or validated A21s Linux 5.10 kernel is produced.' | tee -a results/SUMMARY.txt
          echo 'PASS only means fdtoverlay could apply, not that drivers, pinctrl, clocks, modules, or boot work.' | tee -a results/SUMMARY.txt
          python3 kernel-5.10/scripts/check-dtbo-symbols.py \
            results/s5e3830_5.10.dtb \
            results/a21s-r00.dtbo results/a21s-r01.dtbo \
            results/a21s-r02.dtbo results/a21s-r03.dtbo results/a21s-r06.dtbo \
            --report results/a21s-missing-base-symbols.txt || true
          cat results/a21s-missing-base-symbols.txt | tee -a results/SUMMARY.txt
          echo '== Validate actual target paths after chosen-symbol probe ==' | tee -a results/SUMMARY.txt
          python3 kernel-5.10/scripts/check-dtbo-symbols.py \
            results/s5e3830_chosen_probe.dtb \
            results/a21s-r00.dtbo results/a21s-r01.dtbo \
            results/a21s-r02.dtbo results/a21s-r03.dtbo results/a21s-r06.dtbo \
            --report results/a21s-patched-symbol-target-check.txt || true
          cat results/a21s-patched-symbol-target-check.txt | tee -a results/SUMMARY.txt
          echo '== Overlay fixup entry location validation ==' | tee -a results/SUMMARY.txt
          python3 kernel-5.10/scripts/check-dtbo-fixup-locations.py \
            results/a21s-r00.dtbo results/a21s-r01.dtbo \
            results/a21s-r02.dtbo results/a21s-r03.dtbo results/a21s-r06.dtbo \
            --report results/a21s-fixup-location-errors.txt || true
          cat results/a21s-fixup-location-errors.txt | tee -a results/SUMMARY.txt
          echo '== A21s DTBO own-reference integrity audit ==' | tee -a results/SUMMARY.txt
          for rev in r00 r01 r02 r03 r06; do
            python3 kernel-5.10/scripts/validate-overlay-own-references.py "results/a21s-${rev}.dtbo" --report "results/${rev}-self-reference-audit.txt" || true
            cat "results/${rev}-self-reference-audit.txt" | tee -a results/SUMMARY.txt
          done
          echo '== Static overlay fixup diagnostics ==' | tee -a results/SUMMARY.txt
          # Examine dtc's external references (__fixups__) and base symbols.
          # A21s may use numeric phandles without fixups, which cannot be mapped
          # to 5.10 automatically; distinguish that case explicitly.
          dtc -I dtb -O dts -o results/base-decompiled.dts results/s5e3830_5.10.dtb 2>results/base-decompile.log || true
          for rev in r00 r01 r02 r03 r06; do
            dtc -I dtb -O dts -o "results/${rev}-decompiled.dts" "results/a21s-${rev}.dtbo" 2>"results/${rev}-decompile.log" || true
            {
              echo "=== $rev ==="
              echo 'Overlay __fixups__ section:'
              grep -A 16 -m 1 '__fixups__ {' "results/${rev}-decompiled.dts" || echo 'No __fixups__ block found'
              echo 'Potential numeric unresolved phandle placeholders:'
              grep -n -m 8 -E '<0xffffffff|0xffffffff' "results/${rev}-decompiled.dts" | cut -c 1-170 || true
              echo 'Root target paths:'
              grep -n -m 8 'target-path' "results/${rev}-decompiled.dts" | cut -c 1-170 || true
            } | tee "results/${rev}-fixups-summary.txt" | tee -a results/SUMMARY.txt
          done
          echo 'NOTE: FDT_ERR_NOTFOUND does not identify the missing node; compare fixups with 5.10 __symbols__ before changing any phandle.' | tee -a results/SUMMARY.txt
          echo '== First overlay diagnostic lines ==' | tee -a results/SUMMARY.txt
          for rev in r00 r01 r02 r03 r06; do
            echo "=== $rev ===" | tee -a results/SUMMARY.txt
            if test -f "results/${rev}-overlay.log"; then
              sed -n '1,14p' "results/${rev}-overlay.log" | tee -a results/SUMMARY.txt
            fi
          done
          cat results/SUMMARY.txt >> "$GITHUB_STEP_SUMMARY"
          if test "$patched_failed" -gt 0 || test "$patched_success" -ne 5; then
            echo "::error::A21s overlays still fail even with chosen symbol repaired in temporary base; DO NOT FLASH."
            exit 1
          fi
          echo "::notice::All overlays applied to temporary chosen-symbol base. Porting and real hardware validation still required."
      - name: Upload compatibility logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-5-10-dtbo-compatibility-NOT-FLASHABLE
          path: results/
          if-no-files-found: warn
