name: A21s 5.10 source audit (NOT FLASH READY)
on:
  workflow_dispatch:
  push:
    branches: [a21s-5-10-port-preflight]
    paths:
      - '.github/workflows/a21s-5-10-port-preflight.yml'
      - 'scripts/a21s-port-audit.sh'
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Run A21s source inspection
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/a21s-port-audit.sh report
          {
            echo '## A21s Linux 5.10 source preflight'
            echo 'This is an audit only. No kernel compilation or flash-ready image.'
            echo ''
            echo 'See uploaded artifact a21s-5-10-port-feasibility for full report.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-5-10-port-feasibility
          path: report/
          if-no-files-found: warn
